<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Heads Up!</title>
<style>
:root{--bg:#FFE066;--bg2:#FF8FAB;--ink:#1b1b3a;--card:#fff;--pri:#6C5CE7;--ok:#00B894;--no:#FF5E57;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2b2350;--bg2:#512b81;--ink:#fff;--card:#3d3270}}
:root[data-theme="dark"]{--bg:#2b2350;--bg2:#512b81;--ink:#fff;--card:#3d3270}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:linear-gradient(160deg,var(--bg),var(--bg2));color:var(--ink);font-family:"Trebuchet MS","Arial Rounded MT Bold",system-ui,sans-serif;transition:background .15s}
body.ok{background:var(--ok)}body.no{background:var(--no)}
.scr{display:none;flex-direction:column;align-items:center;gap:14px;min-height:100%;padding:20px;max-width:640px;margin:auto;text-align:center}
.scr.on{display:flex}
h1{font-size:clamp(44px,12vw,72px);margin:20px 0 0;letter-spacing:-1px;transform:rotate(-3deg)}
h2{margin:6px 0}
button,.btn{font:inherit;font-weight:700;border:0;border-radius:18px;padding:14px 22px;background:var(--pri);color:#fff;font-size:18px;box-shadow:0 5px 0 rgba(0,0,0,.22);cursor:pointer}
button:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.22)}
button.alt{background:var(--card);color:var(--ink)}
.big{font-size:26px;padding:18px 36px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;width:100%}
.grid button{background:var(--card);color:var(--ink);padding:18px 8px}
.grid small{display:block;opacity:.6;font-weight:400}
.row{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center}
.chip.sel{background:var(--ink);color:var(--bg)}
input[type=number]{font:inherit;width:90px;padding:10px;border-radius:12px;border:2px solid var(--ink);background:var(--card);color:var(--ink)}
textarea{width:100%;min-height:200px;font:inherit;padding:12px;border-radius:14px;border:2px solid var(--ink);background:var(--card);color:var(--ink)}
.back{align-self:flex-start;padding:8px 14px;font-size:15px}
#cd{font-size:30vmin;font-weight:900}
#play{justify-content:space-between;max-width:none;width:100%}
#word{font-size:clamp(40px,14vmin,120px);font-weight:900;line-height:1.05;word-break:break-word}
.hud{display:flex;justify-content:space-between;width:100%;font-size:26px;font-weight:800}
#pbtns{display:none;gap:16px;width:100%;justify-content:center}
#pbtns button{flex:1;max-width:260px;font-size:24px}
.list{background:var(--card);border-radius:16px;padding:10px 16px;width:100%;text-align:left}
.list b{display:block}.list span{display:inline-block;margin:2px 8px 2px 0}
.hint{opacity:.75;font-size:15px}
</style></head><body>

<section class="scr on" id="home">
 <h1>Heads Up!</h1>
 <p>Hold the phone on your forehead.<br>Tilt <b>down</b> if you got it, <b>up</b> to pass.</p>
 <button class="big" onclick="show('pick')">▶ Play</button>
 <button class="alt" onclick="show('words')">✏️ My Words</button>
</section>

<section class="scr" id="pick">
 <button class="back alt" onclick="show('home')">← Back</button>
 <h2>Pick time</h2>
 <div class="row" id="times"></div>
 <label class="hint"><input type="checkbox" id="btnopt"> Show ✓ / ✗ buttons (auto-on if no tilt sensor)</label>
 <h2>Pick a category</h2>
 <div class="grid" id="cats"></div>
</section>

<section class="scr" id="ready" style="justify-content:center">
 <h2>📱 Phone on your forehead!</h2><div id="cd">3</div>
</section>

<section class="scr" id="play">
 <div class="hud"><span id="tm">60</span><span id="sc">0 ✓</span></div>
 <div id="word"></div>
 <div id="pbtns"><button style="background:var(--no)" onclick="mark(0)">✗ Pass</button><button style="background:var(--ok)" onclick="mark(1)">✓ Got it</button></div>
</section>

<section class="scr" id="result">
 <h1 style="font-size:clamp(30px,9vw,52px)">Time's up!</h1>
 <div id="final" style="font-size:64px;font-weight:900"></div>
 <div class="list"><b>✓ Correct</b><div id="rok"></div></div>
 <div class="list"><b>✗ Passed</b><div id="rno"></div></div>
 <div class="row"><button class="big" onclick="begin(G.name)">↻ Again</button><button class="alt big" onclick="show('pick')">Categories</button></div>
</section>

<section class="scr" id="words">
 <button class="back alt" onclick="show('home')">← Back</button>
 <h2>My custom words</h2>
 <p class="hint">One word per line. Saved only on this device.</p>
 <textarea id="cw" placeholder="Pineapple&#10;Grandma&#10;Karaoke"></textarea>
 <div class="row">
  <button onclick="saveCustom()">💾 Save</button>
  <button class="alt" onclick="exportW()">⬇ Export</button>
  <button class="alt" onclick="document.getElementById('imp').click()">⬆ Import</button>
 </div>
 <input type="file" id="imp" accept=".json,.txt,.csv" hidden>
 <textarea id="xbox" style="display:none;min-height:100px" readonly></textarea>
 <p class="hint" id="msg"></p>
</section>

<script>
const BASE={
"Animals":"Dog,Cat,Elephant,Lion,Tiger,Monkey,Giraffe,Penguin,Kangaroo,Dolphin,Shark,Eagle,Snake,Frog,Horse,Cow,Pig,Sheep,Rabbit,Bear,Zebra,Crocodile,Owl,Butterfly,Spider,Octopus,Parrot",
"Food & Drinks":"Pizza,Burger,Ice Cream,Chocolate,Pasta,Rice,Sandwich,Popcorn,French Fries,Pancake,Cake,Banana,Apple,Mango,Watermelon,Orange Juice,Coffee,Tea,Milkshake,Cheese,Egg,Noodles,Soup,Donut,Cookie,Samosa,Salad",
"Jobs":"Doctor,Teacher,Chef,Pilot,Firefighter,Police Officer,Farmer,Dentist,Nurse,Singer,Dancer,Painter,Driver,Builder,Barber,Astronaut,Scientist,Lawyer,Clown,Magician,Photographer,Waiter,Plumber,Electrician,Soldier,Actor,Engineer",
"Sports & Games":"Football,Cricket,Basketball,Tennis,Swimming,Boxing,Golf,Volleyball,Badminton,Chess,Cycling,Running,Skiing,Surfing,Archery,Yoga,Karate,Skateboarding,Baseball,Hockey,Table Tennis,Bowling,Wrestling,Hide and Seek,Tag,Musical Chairs,Tug of War",
"Countries & Cities":"India,USA,China,Japan,Brazil,Australia,Egypt,France,Italy,Canada,Mexico,Russia,Germany,Spain,Kenya,London,Paris,New York,Dubai,Tokyo,Sydney,Mumbai,Delhi,Bengaluru,Singapore,Rome,Bangkok",
"Things at Home":"Bed,Sofa,Television,Fridge,Fan,Mirror,Clock,Pillow,Blanket,Toothbrush,Spoon,Plate,Cup,Door,Window,Lamp,Broom,Bucket,Towel,Soap,Umbrella,Key,Remote Control,Washing Machine,Microwave,Stairs,Candle",
"Act It Out":"Dancing,Sleeping,Swimming,Cooking,Laughing,Crying,Jumping,Running,Singing,Brushing Teeth,Driving,Climbing,Eating,Drinking,Reading,Writing,Sneezing,Yawning,Whistling,Clapping,Waving,Kicking,Throwing,Painting,Fishing,Hugging,Skipping",
"Nature & Places":"Mountain,River,Beach,Forest,Desert,Island,Volcano,Waterfall,Rainbow,Moon,Sun,Star,Cloud,Rain,Snow,Lightning,Ocean,Cave,Garden,Farm,Zoo,School,Hospital,Airport,Temple,Library,Stadium",
"Clothes & Accessories":"Shirt,Jeans,Dress,Shoes,Socks,Hat,Cap,Scarf,Gloves,Jacket,Sweater,Watch,Sunglasses,Belt,Tie,Saree,Backpack,Wallet,Ring,Necklace,Earrings,Slippers,Raincoat,Uniform,Pajamas,Shorts,Helmet",
"Transport":"Car,Bus,Train,Airplane,Helicopter,Bicycle,Motorcycle,Boat,Ship,Truck,Taxi,Auto Rickshaw,Metro,Ambulance,Fire Truck,Submarine,Rocket,Scooter,Tractor,Hot Air Balloon,Skateboard,Ferry,Jeep,Van,Parachute,Cable Car,Roller Skates"};
for(const k in BASE)BASE[k]=BASE[k].split(",");

const $=id=>document.getElementById(id);
const ld=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}};
const sv=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
let U=ld('hu_user',{Custom:[]}), S=Object.assign({t:60,btn:false},ld('hu_set',{}));
let G=null, sensorOK=false, audio=null;
const all=()=>Object.assign({},BASE,U);

function show(id){
 document.querySelectorAll('.scr').forEach(s=>s.classList.toggle('on',s.id===id));
 if(id==='pick')renderPick();
 if(id==='words'){$('cw').value=(U.Custom||[]).join('\n');$('xbox').style.display='none';$('msg').textContent=''}
}
function renderPick(){
 const t=$('times');t.innerHTML='';
 [30,60,90].forEach(n=>{const b=document.createElement('button');b.className='chip alt'+(S.t===n?' sel':'');b.textContent=n+'s';b.onclick=()=>{S.t=n;sv('hu_set',S);renderPick()};t.appendChild(b)});
 const std=[30,60,90].includes(S.t);
 const i=document.createElement('input');i.type='number';i.min=10;i.max=600;i.placeholder='custom s';if(!std)i.value=S.t;
 i.onchange=()=>{const v=Math.max(10,Math.min(600,+i.value||60));S.t=v;sv('hu_set',S);renderPick()};
 t.appendChild(i);
 $('btnopt').checked=S.btn;$('btnopt').onchange=e=>{S.btn=e.target.checked;sv('hu_set',S)};
 const g=$('cats');g.innerHTML='';
 const c=all();
 for(const k in c){const b=document.createElement('button');b.innerHTML=k+'<small>'+c[k].length+' words</small>';b.onclick=()=>begin(k);g.appendChild(b)}
}
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};

async function askSensor(){
 try{
  if(typeof DeviceOrientationEvent==='undefined')return false;
  if(typeof DeviceOrientationEvent.requestPermission==='function')
   return (await DeviceOrientationEvent.requestPermission())==='granted';
  return true;
 }catch(e){return false}
}
async function begin(name){
 const w=all()[name]||[];
 if(!w.length){alert('Add some words first!');show('words');return}
 sensorOK=await askSensor();            // must stay first: iOS needs the tap gesture
 try{audio=audio||new (window.AudioContext||window.webkitAudioContext)()}catch(e){}
 try{screen.orientation&&screen.orientation.lock&&screen.orientation.lock('landscape').catch(()=>{})}catch(e){}
 try{navigator.wakeLock&&navigator.wakeLock.request('screen').then(l=>G&&(G.wl=l)).catch(()=>{})}catch(e){}
 G={name,deck:shuffle(w),i:0,ok:[],no:[],armed:false,state:'ready',end:0,seen:false};
 show('ready');
 let n=3;$('cd').textContent=n;
 const iv=setInterval(()=>{n--;if(n>0){$('cd').textContent=n;beep(500)}else{clearInterval(iv);play()}},1000);
 if(sensorOK)window.addEventListener('deviceorientation',onTilt);
}
function play(){
 G.state='play';G.end=Date.now()+S.t*1000;show('play');beep(800);nextWord();
 $('pbtns').style.display=(S.btn||!sensorOK)?'flex':'none';
 G.timer=setInterval(tick,200);tick();
 setTimeout(()=>{if(G&&G.state==='play'&&!G.seen){$('pbtns').style.display='flex'}},2000); // no sensor data → buttons
}
function tick(){
 const left=Math.max(0,Math.ceil((G.end-Date.now())/1000));
 $('tm').textContent='⏱ '+left;
 if(left<=0)finish();
}
function nextWord(){
 if(G.i>=G.deck.length){G.deck=shuffle(all()[G.name]);G.i=0}
 $('word').textContent=G.deck[G.i];G.lock=false;
}
function onTilt(e){
 if(!G||G.state!=='play'||e.beta==null||e.gamma==null)return;
 G.seen=true;
 const r=Math.PI/180, z=Math.cos(e.beta*r)*Math.cos(e.gamma*r); // +1 screen faces ceiling, -1 faces floor
 if(Math.abs(z)<.3)G.armed=true;
 else if(G.armed&&!G.lock){if(z<-.6)mark(1);else if(z>.6)mark(0)}
}
function mark(ok){
 if(!G||G.state!=='play'||G.lock)return;
 G.lock=true;G.armed=false;
 (ok?G.ok:G.no).push(G.deck[G.i]);G.i++;
 $('sc').textContent=G.ok.length+' ✓';
 $('word').textContent=ok?'✓ Correct!':'Pass';
 document.body.className=ok?'ok':'no';
 try{navigator.vibrate&&navigator.vibrate(ok?80:[40,40,40])}catch(e){}
 beep(ok?900:300);
 setTimeout(()=>{document.body.className='';if(G&&G.state==='play')nextWord()},550);
}
function beep(f){try{if(!audio)return;const o=audio.createOscillator(),g=audio.createGain();o.frequency.value=f;g.gain.value=.12;o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+.12)}catch(e){}}
function finish(){
 G.state='done';clearInterval(G.timer);window.removeEventListener('deviceorientation',onTilt);
 try{G.wl&&G.wl.release()}catch(e){}
 try{screen.orientation&&screen.orientation.unlock&&screen.orientation.unlock()}catch(e){}
 document.body.className='';beep(400);
 $('final').textContent=G.ok.length+' ✓';
 const fill=(el,a)=>{el.innerHTML=a.length?a.map(w=>'<span></span>').join(''):'—';[...el.children].forEach((s,i)=>s.textContent=a[i])};
 fill($('rok'),G.ok);fill($('rno'),G.no);show('result');
}

/* custom words, import / export */
const clean=t=>[...new Set(t.split(/[\n,]+/).map(s=>s.trim()).filter(Boolean))];
function saveCustom(){U.Custom=clean($('cw').value);sv('hu_user',U);$('msg').textContent='Saved '+U.Custom.length+' words ✓'}
async function exportW(){
 const json=JSON.stringify({app:'headsup',categories:all()},null,1);
 let dl=null;try{dl=window.claude&&await claude.use('downloads')}catch(e){}
 if(dl){try{await dl.save({filename:'headsup-words.json',data:json});return}catch(e){if(e&&e.code==='declined')return}}
 const x=$('xbox');x.style.display='block';x.value=json;x.select();
 $('msg').textContent='Copy this text and save it as a .json or .txt file.';
}
$('imp').onchange=async e=>{
 const f=e.target.files[0];if(!f)return;
 try{
  const txt=await f.text();let added=0;
  try{
   const j=JSON.parse(txt),c=j.categories||j;
   for(const k in c)if(Array.isArray(c[k])){const w=clean(c[k].map(String).join('\n'));if(w.length&&!(k in BASE)){U[k]=clean([...(U[k]||[]),...w].join('\n'));added+=w.length}}
  }catch(_){const w=clean(txt);U.Custom=clean([...(U.Custom||[]),...w].join('\n'));added=w.length}
  sv('hu_user',U);$('cw').value=(U.Custom||[]).join('\n');$('msg').textContent='Imported '+added+' words ✓'
 }catch(err){$('msg').textContent='Could not read that file.'}
 e.target.value='';
};
</script></body></html>
